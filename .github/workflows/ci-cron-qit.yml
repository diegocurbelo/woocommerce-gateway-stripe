name: Scheduled Weekly QIT
description: Builds a package and runs the QIT tests.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1' # At 00:00 on Monday

jobs:

  build-project:
    name: Build package
    uses: ./.github/workflows/build-upload-zip.yml
    with:
      artifact: 'weekly-test-package'

  qit-tests:
    name: Run QIT
    needs: build-project
    uses: ./.github/workflows/run-qit.yml
    secrets: inherit
    with:
      extension: 'woocommerce-gateway-stripe'
      artifact: 'weekly-test-package'
      wp-version: 'nightly'
      wc-version: 'nightly'
      test-activation: false
      test-security: false
      test-phpcompatibility: false
      test-validation: false
      test-phpstan: true # TODO: Enable this once the PHPStan tests are fixed
      test-plugin-check: false # TODO: Enable this once the WP.org Plugin Check tests are fixed
      test-woo-api: true
      test-woo-e2e: true
      test-malware: true

  handle-error:
    if: ${{ failure() }}
    needs: qit-tests
    name: Handle failure
    runs-on: ubuntu-latest
    env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: act10ns/slack@v2
        with:
          status: failure
          message: "Workflow <{{workflowUrl}}|{{workflow}}> with run ID <{{workflowRunUrl}}|{{runId}}> failed."
  
